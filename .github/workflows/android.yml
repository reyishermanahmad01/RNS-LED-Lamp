
name: Build APK RNS

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil source code
        uses: actions/checkout@v4

      - name: Siapkan Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ekstrak proyek Android native
        run: |
          unzip -q "RNS-Android-and-Firmware (1terakhir).zip" -d .
          test -f android-rns/app/build.gradle.kts

      - name: Siapkan Gradle
        working-directory: android-rns
        run: |
          rm -f local.properties
          chmod +x gradlew

      - name: Build APK RNS
        working-directory: android-rns
        run: ./gradlew assembleDebug

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: RNS-APK
          path: android-rns/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
